<div class="public-layout">
  <aside class="public-layout__aside">
    <app-brand-mark />
    <div class="public-layout__message">
      <span class="public-layout__kicker">{{ 'brand.kicker' | transloco }}</span>
      <h2>{{ 'publicLayout.title' | transloco }}</h2>
      <p>{{ 'publicLayout.description' | transloco }}</p>
    </div>
    <div class="public-layout__note">
      <span class="public-layout__note-icon"><i class="pi pi-lock"></i></span>
      <span>{{ 'publicLayout.securityNote' | transloco }}</span>
    </div>
  </aside>

  <main class="public-layout__main">
    <div class="public-layout__mobile-brand">
      <app-brand-mark />
    </div>
    <router-outlet />
    <footer>{{ 'brand.footer' | transloco }}</footer>
  </main>
</div>
