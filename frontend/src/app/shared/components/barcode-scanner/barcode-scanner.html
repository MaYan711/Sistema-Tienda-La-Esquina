<div class="scanner-backdrop" (click)="close()"></div>

<section
  class="scanner-modal"
  role="dialog"
  aria-modal="true"
  aria-label="Escáner de código de barras"
>
  <header>
    <div>
      <span>Cámara del dispositivo</span>
      <h2>Escanear código de barras</h2>
    </div>

    <button type="button" title="Cerrar" (click)="close()">
      <i class="pi pi-times"></i>
    </button>
  </header>

  <div class="scanner-view">
    <video
      #video
      autoplay
      playsinline
      muted
    ></video>

    <div class="scanner-frame"></div>

    @if (loading()) {
      <div class="scanner-status">
        <i class="pi pi-spin pi-spinner"></i>
        Iniciando cámara...
      </div>
    }
  </div>

  <p class="scanner-help">
    Coloca el código dentro del recuadro y mantén el teléfono estable.
    Se utilizará preferentemente la cámara trasera del dispositivo.
  </p>

  @if (errorMessage()) {
    <div class="scanner-error">
      <i class="pi pi-exclamation-triangle"></i>
      <span>{{ errorMessage() }}</span>
    </div>
  }

  <div class="manual-entry">
    <label for="manual-barcode">Código manual</label>

    <div>
      <input
        #manualCode
        id="manual-barcode"
        type="text"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        placeholder="Escribe o pega el código"
      />

      <button
        type="button"
        (click)="useManualCode(manualCode.value)"
      >
        Usar código
      </button>
    </div>
  </div>
</section>
