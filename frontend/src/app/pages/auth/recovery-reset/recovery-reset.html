<section class="auth-page auth-page--compact">
  <a class="back-link" routerLink="/auth/recovery"
    ><i class="pi pi-arrow-left"></i>{{ 'common.back' | transloco }}</a
  >
  <span class="auth-page__kicker">{{ 'auth.reset.kicker' | transloco }}</span>
  <h1>{{ 'auth.reset.title' | transloco }}</h1>
  <p class="auth-page__intro">{{ 'auth.reset.description' | transloco }}</p>

  <app-form-feedback [message]="errorMessage()" />
  <app-form-feedback [message]="successMessage()" tone="success" />

  <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="form-field">
      <label for="reset-email">{{ 'auth.fields.email' | transloco }}</label>
      <input
        id="reset-email"
        pInputText
        type="email"
        formControlName="email"
        autocomplete="email"
      />
      <app-field-error [control]="form.controls.email" [submitted]="submitted()" />
    </div>

    <div class="form-field">
      <label for="reset-otp">{{ 'auth.fields.otp' | transloco }}</label>
      <input
        id="reset-otp"
        pInputText
        type="text"
        inputmode="numeric"
        maxlength="6"
        autocomplete="one-time-code"
        formControlName="otp"
        [placeholder]="'auth.fields.otpPlaceholder' | transloco"
      />
      <app-field-error [control]="form.controls.otp" [submitted]="submitted()" kind="otp" />
    </div>

    <div class="form-field">
      <label for="reset-password">{{ 'auth.fields.newPassword' | transloco }}</label>
      <input
        id="reset-password"
        pInputText
        type="password"
        formControlName="newPassword"
        autocomplete="new-password"
        [placeholder]="'auth.fields.newPasswordPlaceholder' | transloco"
      />
      <app-field-error
        [control]="form.controls.newPassword"
        [submitted]="submitted()"
        kind="password"
      />
      <small class="field-hint">{{ 'auth.fields.passwordHint' | transloco }}</small>
    </div>

    <button class="primary-button" type="submit" [disabled]="isSubmitting()">
      @if (isSubmitting()) {
        <i class="pi pi-spin pi-spinner"></i>
      }
      <span>{{ 'auth.reset.submit' | transloco }}</span>
    </button>
  </form>
</section>
