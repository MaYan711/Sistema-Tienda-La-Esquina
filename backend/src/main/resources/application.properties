spring.application.name=tienda-api
spring.profiles.active=dev
server.servlet.context-path=/api/v1

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_SENDER_APP}
spring.mail.password=${EMAIL_SENDER_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Spring Data JPA
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# Multipart
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# JWT. The signing secret is intentionally required and validated at startup.
security.jwt.secret-key=${SECRET_KEY_JWT:}
security.jwt.expiration-time=${EXPIRATION_TIME_JWT:86400000}

# OTP policy
security.otp.length=${OTP_LENGTH:6}
security.otp.expiration=${OTP_EXPIRATION:PT10M}
security.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
security.otp.resend-cooldown=${OTP_RESEND_COOLDOWN:PT1M}

# The bootstrap password is required when the application starts.
app.bootstrap.admin.email=${INITIAL_ADMIN_EMAIL:admin@tiendalaesquina.local}
app.bootstrap.admin.initial-password=${INITIAL_ADMIN_PASSWORD:}

# OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
