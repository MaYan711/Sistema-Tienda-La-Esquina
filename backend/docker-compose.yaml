services:
  postgres:
    image: postgres:18
    container_name: tienda-la-esquina-postgres
    restart: unless-stopped
    shm_size: 128mb

    environment:
      POSTGRES_DB: tienda_la_esquina_db
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}

    ports:
      - "5438:5432"

    volumes:
      - tienda_postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  tienda_postgres_data: